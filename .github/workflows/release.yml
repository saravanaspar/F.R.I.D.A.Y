name: Publish Release

on:
  push:
    branches:
      - main
    paths:
      - package.json
  workflow_dispatch:

permissions:
  contents: read

# A merged release-preparation PR changes package.json on main and starts this
# workflow. Manual dispatch remains available for retrying an unpublished
# version already present on main.
concurrency:
  group: release-publish-main
  cancel-in-progress: false

jobs:
  validate:
    name: Detect unpublished release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      publish: ${{ steps.release.outputs.publish }}
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag }}
      canonical: ${{ steps.release.outputs.canonical }}
      sha: ${{ steps.release.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f # v6.1.0
        with:
          node-version-file: .node-version

      - name: Detect synchronized version without an existing tag
        id: release
        shell: bash
        run: |
          set -euo pipefail

          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "Releases may only run from the main branch." >&2
            exit 1
          fi

          checked_out="$(git rev-parse HEAD)"
          if [ "$checked_out" != "$GITHUB_SHA" ]; then
            echo "Release checkout does not match the triggering main commit." >&2
            echo "event sha:   $GITHUB_SHA" >&2
            echo "checked out: $checked_out" >&2
            exit 1
          fi

          release_version="$(node -p "require('./package.json').version")"
          if [[ "$release_version" == *-* ]]; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "Package version $release_version is a development version; no release is due." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          node scripts/release-version.mjs "$release_version" --check-packages
          canonical_version="$(node scripts/release-version.mjs "$release_version" --canonical)"
          git fetch --force --tags origin

          while IFS= read -r tag; do
            if canonical="$(node scripts/release-version.mjs "$tag" --canonical 2>/dev/null)"; then
              if [ "$canonical" = "$canonical_version" ]; then
                echo "publish=false" >> "$GITHUB_OUTPUT"
                echo "Release $release_version is already represented by tag $tag; nothing to publish." >> "$GITHUB_STEP_SUMMARY"
                exit 0
              fi
            fi
          done < <(git tag --list 'v*.*.*')

          node scripts/release-version.mjs "$release_version" --github-output "$GITHUB_OUTPUT"
          echo "sha=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
          echo "publish=true" >> "$GITHUB_OUTPUT"
          echo "Publishing F.R.I.D.A.Y $release_version from $GITHUB_SHA after all release gates pass." >> "$GITHUB_STEP_SUMMARY"

  verify:
    name: Verify release source
    needs: validate
    if: needs.validate.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f # v6.1.0
        with:
          node-version-file: .node-version
          cache: npm
      - uses: astral-sh/setup-uv@cec208311dfd045dd5311c1add060b2062131d57 # v8.0.0, immutable
        with:
          version: "0.11.6"
      - run: npm ci
      - run: npm run setup:execution-python
      - run: npm run verify

  sbom:
    name: Build release SBOM
    needs: [validate, verify]
    if: needs.validate.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f # v6.1.0
        with:
          node-version-file: .node-version
      - name: Install locked dependencies for SBOM
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Generate SPDX SBOM
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/release
          npm sbom --sbom-format spdx > build/release/friday-sbom.spdx.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: friday-sbom
          path: build/release/friday-sbom.spdx.json
          if-no-files-found: error
          retention-days: 7

  build:
    name: Build ${{ matrix.asset }}
    needs: [validate, verify]
    if: needs.validate.outputs.publish == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            asset: friday-linux-x64
          - runner: ubuntu-24.04-arm
            asset: friday-linux-arm64
          - runner: macos-15-intel
            asset: friday-darwin-x64
          - runner: macos-15
            asset: friday-darwin-arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    env:
      FRIDAY_BUILD_VERSION: ${{ needs.validate.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f # v6.1.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run package:binary

      - name: Verify packaged asset name and embedded version
        shell: bash
        run: |
          set -euo pipefail
          test -f "build/release/${{ matrix.asset }}"
          test -f "build/release/${{ matrix.asset }}.sha256"
          test "$(build/release/${{ matrix.asset }} --version)" = "$FRIDAY_BUILD_VERSION"

      - name: Smoke packaged Linux runtime
        if: startsWith(matrix.asset, 'friday-linux-')
        shell: bash
        run: scripts/smoke-release-binary.sh "build/release/${{ matrix.asset }}"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.asset }}
          path: |
            build/release/${{ matrix.asset }}
            build/release/${{ matrix.asset }}.sha256
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish GitHub Release
    needs: [validate, verify, sbom, build]
    if: needs.validate.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      RELEASE_SHA: ${{ needs.validate.outputs.sha }}
      RELEASE_TAG: ${{ needs.validate.outputs.tag }}
      RELEASE_VERSION: ${{ needs.validate.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Confirm the release source remains on main
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          if [ "$(git rev-parse HEAD)" != "$RELEASE_SHA" ]; then
            echo "Release checkout changed during the build." >&2
            exit 1
          fi
          if ! git merge-base --is-ancestor "$RELEASE_SHA" origin/main; then
            echo "Release source $RELEASE_SHA is no longer reachable from main." >&2
            exit 1
          fi

      - name: Refuse a tag or release created during the build
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --tags origin "refs/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Tag $RELEASE_TAG appeared while the release was building; refusing to overwrite it." >&2
            exit 1
          fi
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists; refusing to replace it." >&2
            exit 1
          fi

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: friday-*
          path: release
          merge-multiple: true

      - name: Stage verified installer assets
        shell: bash
        run: |
          set -euo pipefail
          cp scripts/install-release.sh release/install-release.sh
          cp scripts/install-release.ps1 release/install-release.ps1
          chmod 0755 release/install-release.sh

      - name: Verify complete release payload
        shell: bash
        run: |
          set -euo pipefail
          expected=(
            friday-linux-x64
            friday-linux-arm64
            friday-darwin-x64
            friday-darwin-arm64
          )

          for asset in "${expected[@]}"; do
            test -f "release/$asset" || { echo "Missing release asset: $asset" >&2; exit 1; }
            test -f "release/$asset.sha256" || { echo "Missing checksum: $asset.sha256" >&2; exit 1; }
            (cd release && sha256sum -c "$asset.sha256")
          done
          test -s release/friday-sbom.spdx.json
          test -s release/install-release.sh
          test -s release/install-release.ps1
          (cd release && sha256sum "${expected[@]}" friday-sbom.spdx.json install-release.sh install-release.ps1 > SHA256SUMS)

      - name: Attest release binaries and SBOM
        id: provenance
        uses: actions/attest-build-provenance@00014ed6ed5efc5b1ab7f7f34a39eb55d41aa4f8 # v3.1.0
        with:
          subject-path: |
            release/friday-linux-x64
            release/friday-linux-arm64
            release/friday-darwin-x64
            release/friday-darwin-arm64
            release/friday-sbom.spdx.json
            release/install-release.sh
            release/install-release.ps1
            release/SHA256SUMS

      - name: Include offline-verifiable provenance bundle
        shell: bash
        env:
          PROVENANCE_BUNDLE: ${{ steps.provenance.outputs.bundle-path }}
        run: |
          set -euo pipefail
          test -s "$PROVENANCE_BUNDLE"
          cp "$PROVENANCE_BUNDLE" release/friday-build-provenance.json
          test -s release/friday-build-provenance.json

      - name: Create tag and publish release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "$RELEASE_TAG" \
            release/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$RELEASE_SHA" \
            --latest \
            --title "F.R.I.D.A.Y $RELEASE_VERSION" \
            --generate-notes
