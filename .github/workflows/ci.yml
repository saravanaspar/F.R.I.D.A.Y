name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

# Short-lived development branches verify through their pull request to main.
# Key concurrency by commit so repeated PR updates replace stale verification runs.
concurrency:
  group: ci-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f # v6.1.0
        with:
          node-version-file: .node-version
          cache: npm
      - uses: astral-sh/setup-uv@cec208311dfd045dd5311c1add060b2062131d57 # v8.0.0, immutable
        with:
          version: "0.11.6"
      - run: npm ci
      - run: npm run setup:execution-python
      - run: npm run verify

  linux-binary-smoke:
    name: Linux SEA runtime smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f # v6.1.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run package:binary
      - name: Start the packaged runtime from an unsafe bootstrap directory
        shell: bash
        run: scripts/smoke-release-binary.sh build/release/friday-linux-x64

  sandbox-provider-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f # v6.1.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npx vitest run --config vitest.config.ts test/sandbox-provider.test.ts test/security.test.ts

  darwin-binary-smoke:
    name: Darwin SEA smoke (${{ matrix.asset }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            asset: friday-darwin-x64
          - runner: macos-15
            asset: friday-darwin-arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f # v6.1.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run package:binary
      - name: Verify Darwin packaged binary
        shell: bash
        run: |
          set -euo pipefail
          test -f "build/release/${{ matrix.asset }}"
          "build/release/${{ matrix.asset }}" --version
