name: Documentation improvement
description: Report missing, unclear, outdated, or hard-to-find documentation
title: "[Docs]: "
labels:
  - documentation
body:
  - type: dropdown
    id: audience
    attributes:
      label: Audience
      options:
        - New user / installation
        - Operator / administrator
        - Plugin contributor
        - Core contributor
        - Security / architecture reader
        - Other
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: What is hard to understand or find?
      description: Include the page/section if one already exists.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What should the documentation make clear?
    validations:
      required: true

  - type: textarea
    id: suggestion
    attributes:
      label: Suggested improvement
      description: Optional wording, examples, diagrams, links, or structure that would help.

  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues for the same documentation gap.
          required: true
        - label: This does not contain credentials or private data.
          required: true
