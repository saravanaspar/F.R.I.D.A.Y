name: Feature request
description: Propose a new capability or user-facing improvement
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user problem or limitation are you trying to solve?
    validations:
      required: true

  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
      description: Describe the behavior you want without assuming a specific implementation.
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Context / examples
      description: Example conversations, workflows, integrations, or failure cases that make the need concrete.

  - type: textarea
    id: architecture
    attributes:
      label: Architecture or security considerations
      description: If known, mention affected plugins, trust boundaries, persistence, permissions, or external side effects.

  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues and pull requests for a similar request.
          required: true
        - label: I described the user problem, not only an implementation preference.
          required: true
