# Compatibility-mode compositor for GNOME/KDE/XFCE hosts.
# It intentionally has no physical Human output; the person's normal desktop remains separate.

# The compatibility compositor must not compete with the Human desktop for X11 sockets.
xwayland disable

# Give every synthetic output an explicit background so swaybg does not warn about
# newly-created HEADLESS-* outputs with no matching configuration.
output * bg #000000 solid_color

exec_always --no-startup-id systemctl --user import-environment SWAYSOCK WAYLAND_DISPLAY DISPLAY XDG_CURRENT_DESKTOP FRIDAY_COMPUTER_SESSION_MODE
exec_always --no-startup-id /bin/sh -lc 'want="${FRIDAY_COMPUTER_AGENT_SCREENS:-2}"; have="$(swaymsg -t get_outputs -r | grep -o "HEADLESS-[0-9][0-9]*" | sort -u | wc -l)"; while [ "$have" -lt "$want" ]; do swaymsg create_output >/dev/null; have=$((have + 1)); done'
exec_always --no-startup-id systemctl --user restart friday-computer-browser.service

# Keep the headless compositor alive; browser windows are created and placed by CDP.
workspace 1
