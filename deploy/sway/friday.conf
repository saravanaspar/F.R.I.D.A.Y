# Managed-session Sway configuration for F.R.I.D.A.Y Phase 5.
# This keeps the physical output as the Human screen and creates headless Agent outputs.
# Copy to ~/.config/friday/sway.conf and launch Sway with: sway -c ~/.config/friday/sway.conf

include /etc/sway/config

# Publish this compositor's socket/display to user services, then make sure the
# dedicated shared Chromium profile is running in the same Wayland session.
exec_always --no-startup-id systemctl --user import-environment SWAYSOCK WAYLAND_DISPLAY DISPLAY XDG_CURRENT_DESKTOP

# Create FRIDAY_COMPUTER_AGENT_SCREENS headless outputs without creating more on
# config reload. The Linux provider classifies HEADLESS-* outputs as Agent screens.
exec_always --no-startup-id /bin/sh -lc 'want="${FRIDAY_COMPUTER_AGENT_SCREENS:-2}"; have="$(swaymsg -t get_outputs -r | grep -o "HEADLESS-[0-9][0-9]*" | sort -u | wc -l)"; while [ "$have" -lt "$want" ]; do swaymsg create_output >/dev/null; have=$((have + 1)); done'
exec_always --no-startup-id systemctl --user restart friday-computer-browser.service
